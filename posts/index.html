<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>News & Posts | Youth of Tayitu</title>
<meta name="description" content="News, announcements, activities and stories from Arada Woreda 1 Youth Personal Development Center.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://youthoftayitu.vercel.app/posts/">
<meta property="og:title" content="News & Posts | Youth of Tayitu">
<meta property="og:description" content="News, announcements, activities and stories from our youth center.">
<meta property="og:type" content="website">
<style>
*{box-sizing:border-box}body{margin:0;font:16px/1.6 Arial,sans-serif;color:#172033;background:#f6f8fb}header{background:#102d50;color:#fff;padding:22px max(5vw,20px)}header a{color:#fff;text-decoration:none}main{max-width:1100px;margin:38px auto;padding:0 20px}h1{font-size:clamp(30px,5vw,44px);margin:0 0 8px}.intro{color:#536178;margin:0 0 28px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px}.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 5px 22px #14213d12}.card img{width:100%;height:190px;object-fit:cover;background:#e8edf4}.body{padding:18px}.body h2{font-size:21px;line-height:1.3;margin:0 0 8px}.body p{color:#596579;margin:0 0 14px}.body a{color:#0758a5;font-weight:700;text-decoration:none}.date{font-size:13px;color:#788398;margin-bottom:8px}.empty{padding:25px;background:#fff;border-radius:12px;color:#586579}footer{padding:35px;text-align:center;color:#778196}
</style>
</head>
<body>
<header><a href="/">← Youth of Tayitu</a></header>
<main>
<h1>News &amp; Posts</h1>
<p class="intro">Updates, announcements, activities and stories from our youth center.</p>
<div id="posts" class="grid"><p>Loading posts…</p></div>
</main>
<footer>Arada Woreda 1 Youth Personal Development Center</footer>
<script>
const SUPABASE_URL="https://vroxuvzbnzfelyndchyl.supabase.co";
const SUPABASE_KEY="sb_publishable_EAh6WbHkV-FRnSx6SjRUgw_ev0JMnZH";
const host=document.getElementById('posts');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
fetch(SUPABASE_URL+'/rest/v1/posts?select=title,slug,excerpt,cover_image,published_at&status=eq.published&order=published_at.desc',{
 headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY}
}).then(r=>{if(!r.ok)throw new Error('Could not load posts');return r.json()}).then(items=>{
 if(!items.length){host.innerHTML='<div class="empty">There are no posts yet. Please check back soon.</div>';return}
 host.innerHTML=items.map(p=>'<article class="card">'+(p.cover_image?'<img loading="lazy" src="'+esc(p.cover_image)+'" alt="'+esc(p.title)+'">':'')+'<div class="body"><div class="date">'+(p.published_at?new Date(p.published_at).toLocaleDateString():'')+'</div><h2>'+esc(p.title)+'</h2><p>'+esc(p.excerpt||'')+'</p><a href="/posts/'+encodeURIComponent(p.slug)+'">Read more →</a></div></article>').join('');
}).catch(()=>{host.innerHTML='<div class="empty">Posts could not be loaded right now. Please try again later.</div>'});
</script>
</body>
</html>
