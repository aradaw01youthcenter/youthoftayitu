<!DOCTYPE html>
<html lang="am"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>News & Posts | Youth of Tayitu</title><meta name="description" content="News, announcements, activities and stories from Arada Woreda 1 Youth Personal Development Center."><meta name="robots" content="index, follow"><link rel="canonical" href="https://youthoftayitu.vercel.app/posts/"><meta property="og:title" content="News & Posts | Youth of Tayitu"><meta property="og:description" content="Updates, announcements, activities and stories from our youth center."><meta property="og:type" content="website"><style>
*{box-sizing:border-box}body{margin:0;font:16px/1.6 Arial,sans-serif;color:#172033;background:#f6f8fb}header{background:#102d50;color:#fff;padding:22px max(5vw,20px)}header a{color:#fff;text-decoration:none}main{max-width:1100px;margin:38px auto;padding:0 20px}h1{font-size:clamp(30px,5vw,44px);margin:0 0 8px}.intro{color:#536178;margin:0 0 24px}.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;background:#fff;padding:16px;border-radius:12px;margin-bottom:24px}.filters input,.filters select{width:100%;padding:11px;border:1px solid #d5dce6;border-radius:8px;font:inherit}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px}.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 5px 22px #14213d12}.card img{width:100%;height:190px;object-fit:cover;background:#e8edf4}.body{padding:18px}.body h2{font-size:21px;line-height:1.3;margin:0 0 8px}.body p{color:#596579;margin:0 0 14px}.body a{color:#0758a5;font-weight:700;text-decoration:none}.date{font-size:13px;color:#788398;margin-bottom:8px}.category{display:inline-block;background:#eaf2fb;color:#164c80;padding:4px 9px;border-radius:20px;font-size:12px;margin-bottom:8px}.empty{padding:25px;background:#fff;border-radius:12px;color:#586579;grid-column:1/-1}footer{padding:35px;text-align:center;color:#778196}
</style></head><body><header><a href="/">← Youth of Tayitu</a></header><main><h1>ዜናዎችና ጽሑፎች</h1><p class="intro">የማዕከሉን ዜናዎች፣ ማስታወቂያዎች፣ እንቅስቃሴዎችና ታሪኮች ይከታተሉ።</p>
<div class="filters"><input id="search" type="search" placeholder="በርዕስ ወይም በይዘት ፈልግ"><select id="category"><option value="">ሁሉም ምድቦች</option><option value="ሳይንስና ፈጠራ">ሳይንስና ፈጠራ</option><option value="በጎ ፈቃድ">በጎ ፈቃድ</option><option value="የጤናና የምክር ድጋፍ">የጤናና የምክር ድጋፍ</option><option value="የህይወት ክህሎት">የህይወት ክህሎት</option><option value="አመራርነት">አመራርነት</option><option value="ስራ ፈጠራና የቢዝነስ">ስራ ፈጠራና የቢዝነስ</option><option value="ስፖርትና መዝናኛ">ስፖርትና መዝናኛ</option></select><select id="period"><option value="all">ሁሉም ጊዜ</option><option value="7">ያለፉት 7 ቀናት</option><option value="30">ያለፉት 30 ቀናት</option><option value="90">ያለፉት 3 ወራት</option><option value="365">ያለፈው 1 ዓመት</option></select><select id="sort"><option value="new">አዲስ መጀመሪያ</option><option value="old">አሮጌ መጀመሪያ</option></select></div>
<div id="posts" class="grid"><p>ጽሑፎች በመጫን ላይ…</p></div></main><footer>Arada Woreda 1 Youth Personal Development Center</footer>
<script>
const SUPABASE_URL="https://vroxuvzbnzfelyndchyl.supabase.co",SUPABASE_KEY="sb_publishable_EAh6WbHkV-FRnSx6SjRUgw_ev0JMnZH",host=document.getElementById('posts');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let allPosts=[];
function render(){const term=document.getElementById('search').value.trim().toLowerCase(),cat=document.getElementById('category').value,days=document.getElementById('period').value,sort=document.getElementById('sort').value,cutoff=days==='all'?0:Date.now()-Number(days)*86400000;
let items=allPosts.filter(p=>(!cat||p.category===cat)&&(!cutoff||new Date(p.published_at||p.created_at).getTime()>=cutoff)&&(!term||(p.title+' '+(p.excerpt||'')+' '+p.content).toLowerCase().includes(term)));
items.sort((a,b)=>(new Date(a.published_at||a.created_at)-new Date(b.published_at||b.created_at))*(sort==='old'?1:-1));
host.innerHTML=items.length?items.map(p=>{const imgs=Array.isArray(p.images)?p.images:[],cover=p.cover_image||imgs[0];return '<article class="card">'+(cover?'<img loading="lazy" src="'+esc(cover)+'" alt="'+esc(p.title)+'">':'')+'<div class="body"><span class="category">'+esc(p.category||'')+'</span><div class="date">'+(p.published_at?new Date(p.published_at).toLocaleDateString():'')+'</div><h2>'+esc(p.title)+'</h2><p>'+esc(p.excerpt||'')+'</p><a href="/posts/'+encodeURIComponent(p.slug)+'">ተጨማሪ ያንብቡ →</a></div></article>'}).join(''):'<div class="empty">የተመረጡትን መስፈርቶች የሚያሟላ ጽሑፍ አልተገኘም።</div>'}
fetch(SUPABASE_URL+'/rest/v1/posts?select=title,slug,excerpt,content,category,cover_image,images,published_at,created_at&status=eq.published&order=published_at.desc',{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY}}).then(r=>{if(!r.ok)throw new Error();return r.json()}).then(items=>{allPosts=items;render()}).catch(()=>{host.innerHTML='<div class="empty">ጽሑፎችን መጫን አልተቻለም። እባክዎ ቆይተው ይሞክሩ።</div>'});
['search','category','period','sort'].forEach(id=>document.getElementById(id).addEventListener(id==='search'?'input':'change',render));
</script></body></html>
